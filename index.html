<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloco Livre 3D</title>
<style>
:root{--bg:#f6f5f1;--panel:#ffffff;--text:#1f2328;--muted:#7a7f88;--line:#e4e2dc;--accent:#f2b705;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
#count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;min-height:36px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:#1f2328;border-color:var(--accent);font-weight:600}
button:disabled{opacity:.4;cursor:default}
#stage{flex:1;position:relative;overflow:hidden;min-height:200px}
#stage canvas{display:block;touch-action:none;cursor:crosshair}
#msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 12px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#msg.show{opacity:.92}
.bar{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:thin}
.sw{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset}
.part{min-width:58px;font-variant-numeric:tabular-nums;font-size:14px}
.label{font-size:12px;color:var(--muted);margin:4px 0 2px}
</style>
</head>
<body>
<header>
  <h1>Bloco Livre 3D</h1>
  <span id="count">0 peças</span>
</header>

<div class="tools">
  <button id="rot">Girar</button>
  <button id="del">Remover</button>
  <button id="undo">Desfazer</button>
  <button id="clear">Limpar</button>
  <button id="view">Vista</button>
</div>

<div id="stage"><div id="msg"></div></div>

<div class="bar">
  <div class="row" id="cats"></div>
  <div class="row" id="parts"></div>
  <div class="label">Cor</div>
  <div class="row" id="colors"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const N = 56;          // tamanho da base em studs
const H = 0.4;         // altura de 1 placa
const MAXH = 120;      // altura máxima em placas

const COLORS = [
  ['Vermelho','#d62828'],['Laranja','#f57c20'],['Amarelo','#f2c230'],['Lima','#9bd13b'],
  ['Verde','#2a9d4b'],['Azul-claro','#6ec6f0'],['Azul','#1f5fbf'],['Azul-marinho','#17305e'],
  ['Roxo','#7b3fa0'],['Rosa','#f08fb6'],['Marrom','#6b4226'],['Bege','#d9c09a'],
  ['Branco','#f5f5f2'],['Cinza claro','#b9bec7'],['Cinza escuro','#5d646e'],['Preto','#202325']
];
const CATS = {
  'Tijolos':   {h:3, stud:true,  list:[[1,1],[1,2],[1,3],[1,4],[1,6],[1,8],[2,2],[2,3],[2,4],[2,6],[2,8],[4,4],[4,6],[4,8]]},
  'Placas':    {h:1, stud:true,  list:[[1,1],[1,2],[1,4],[1,6],[1,8],[2,2],[2,3],[2,4],[2,6],[2,8],[4,4],[4,6],[4,8],[6,6],[6,8]]},
  'Ladrilhos': {h:1, stud:false, list:[[1,1],[1,2],[1,4],[2,2],[2,4],[2,6],[4,4]]},
  'Modelos':   {models:true, list:[]},
  'Personagens': {models:true, list:[]}
};

/* ---------- Modelos (portas, janelas, móveis) ---------- */
// Medidas em unidades de stud (w, d) e placas de altura (h). Y = base do modelo.
const fixedMats={};
function fixedMat(hex){ if(!fixedMats[hex]) fixedMats[hex]=new THREE.MeshStandardMaterial({color:hex,roughness:0.5}); return fixedMats[hex]; }
const glassMat=new THREE.MeshStandardMaterial({color:0x9fd8ff,transparent:true,opacity:0.45,roughness:0.1});
const glowMat=new THREE.MeshStandardMaterial({color:0x8a2be2,emissive:0x8a2be2,emissiveIntensity:0.8,roughness:0.3});

// Minifigura feita de blocos: cabeça amarela, tronco, pernas, braços e acessórios.
// Centro na base, 1 stud de largura, ~2.2 unidades de altura.
function minifig(add,P,o){
  const legs=P.m(o.legs||0x2f3b4f), arm=o.arm||o.torso, Yl=P.m(0xf7c600);
  add(0.34,0.7,0.4,-0.2,0,0,legs); add(0.34,0.7,0.4,0.2,0,0,legs);
  add(0.7,0.75,0.4,0,0.7,0,o.torso);
  add(0.2,0.7,0.2,-0.5,0.75,0,arm); add(0.2,0.7,0.2,0.5,0.75,0,arm);
  add(0.2,0.2,0.2,-0.5,0.55,0,Yl); add(0.2,0.2,0.2,0.5,0.55,0,Yl);
  add(0.6,0.6,0.6,0,1.45,0,Yl);
  if(o.hood){ add(0.66,0.62,0.12,0,1.45,-0.3,o.hood); add(0.66,0.12,0.66,0,2.05,0,o.hood); }
  if(o.hair) add(0.62,0.12,0.62,0,2.05,0,o.hair);
  if(o.head==='helmet'){ add(0.66,0.62,0.66,0,1.43,0,P.m(0xf4f4f4)); add(0.5,0.22,0.04,0,1.7,0.34,P.m(0x2a6fdb)); }
  if(o.head==='ninja'){ add(0.62,0.6,0.62,0,1.45,0,P.m(0x1d1d1d)); add(0.5,0.06,0.04,0,1.78,0.32,P.m(0xffffff)); }
  if(o.head==='pirate'){ add(0.8,0.06,0.8,0,2.05,0,P.m(0x1d1d1d)); add(0.5,0.22,0.5,0,2.11,0,P.m(0x1d1d1d)); add(0.14,0.14,0.02,0.14,1.78,0.31,P.m(0x1d1d1d)); }
  if(o.head==='fire'){ add(0.66,0.4,0.66,0,1.65,0,P.m(0xd62828)); add(0.76,0.08,0.76,0,1.62,0,P.m(0xb01d1d)); }
  if(!o.head){
    add(0.08,0.08,0.02,-0.14,1.8,0.31,P.m(0x111111));
    add(0.08,0.08,0.02,0.14,1.8,0.31,P.m(0x111111));
    add(0.2,0.04,0.02,0,1.6,0.31,P.m(0x111111));
  }
  if(o.glasses) add(0.56,0.12,0.04,0,1.8,0.32,P.m(0x111111));
  if(o.beard) add(0.4,0.14,0.05,0,1.45,0.31,P.m(o.beard));
  if(o.pill) add(0.22,0.1,0.1,0.5,0.6,0.1,P.glow);
  if(o.mon){
    add(0.3,0.36,0.3,-0.62,0.95,0,P.m(0xa0692f));
    add(0.26,0.26,0.26,-0.62,1.27,0,P.m(0xb97a3c));
    add(0.08,0.5,0.08,-0.78,0.6,-0.2,P.m(0x8a5a2b));
  }
}
const WOOD=0x8a5a2b, WHITE=0xf5f5f2, DARK=0x3a3f47, GREEN=0x3f9d4a, POT=0xb5542d;
const MODELS=[
  {key:'porta', name:'Porta', w:1, d:2, h:9, build:(add,P)=>{
    add(0.15,3.2,1.6, 0,0.2,0, P.main);
    add(0.25,0.3,2, 0,3.3,0, P.wood);
    add(0.25,3.6,0.25, 0,0,-0.875, P.wood);
    add(0.25,3.6,0.25, 0,0,0.875, P.wood);
    add(0.1,0.12,0.12, 0.12,1.5,0.5, P.white);
  }},
  {key:'janela', name:'Janela', w:2, d:1, h:9, build:(add,P)=>{
    add(1.9,3.5,0.3, 0,0.05,0, P.white);
    add(1.5,2.9,0.1, 0,0.35,0, P.glass);
    add(1.5,0.08,0.12, 0,1.7,0, P.white);
    add(0.08,2.9,0.12, 0,0.35,0, P.white);
  }},
  {key:'mesa', name:'Mesa', w:2, d:4, h:4, build:(add,P)=>{
    add(1.9,0.25,3.9, 0,1.35,0, P.main);
    for(const x of [-0.85,0.85]) for(const z of [-1.85,1.85]) add(0.18,1.35,0.18, x,0,z, P.wood);
  }},
  {key:'cadeira', name:'Cadeira', w:2, d:2, h:6, build:(add,P)=>{
    add(1.6,0.2,1.6, 0,0.9,0, P.main);
    for(const x of [-0.7,0.7]) for(const z of [-0.7,0.7]) add(0.14,0.9,0.14, x,0,z, P.wood);
    add(1.6,1.3,0.2, 0,1.1,-0.7, P.main);
  }},
  {key:'sofa', name:'Sofá', w:2, d:4, h:4, build:(add,P)=>{
    add(1.9,0.6,3.6, 0,0,0.1, P.main);
    add(1.9,1.0,0.6, 0,0,-1.6, P.main);
    for(const x of [-0.8,0.8]) add(0.3,0.9,3.6, x,0,0.1, P.main);
  }},
  {key:'cama', name:'Cama', w:2, d:4, h:3, build:(add,P)=>{
    add(1.9,0.4,3.9, 0,0,0, P.wood);
    add(1.7,0.3,3.5, 0,0.4,0.1, P.white);
    add(1.9,0.9,0.2, 0,0,-1.9, P.wood);
    add(1.74,0.12,2.2, 0,0.7,0.6, P.main);
    add(1.2,0.15,0.6, 0,0.7,-1.4, P.white);
  }},
  {key:'armario', name:'Armário', w:2, d:1, h:9, build:(add,P)=>{
    add(1.9,3.5,0.9, 0,0,0, P.main);
    for(const x of [-0.3,0.3]) add(0.08,0.4,0.08, x,1.6,0.5, P.white);
  }},
  {key:'vaso', name:'Vaso', w:1, d:1, h:5, build:(add,P)=>{
    add(0.7,0.7,0.7, 0,0,0, P.pot);
    add(0.9,0.8,0.9, 0,0.7,0, P.green);
    add(0.5,0.6,0.5, 0,1.4,0, P.green);
  }},
  {key:'tapete', name:'Tapete', w:4, d:4, h:1, build:(add,P)=>{
    add(3.8,0.06,3.8, 0,0,0, P.main);
  }},
  {key:'mini_base', name:'Minifigura', cat:'Personagens', w:1, d:1, h:6, build:(add,P)=>
    minifig(add,P,{torso:P.main, legs:0x2f3b4f})},
  {key:'mini_shifu', name:'Shifutiago', cat:'Personagens', w:1, d:1, h:6, build:(add,P)=>
    minifig(add,P,{torso:P.m(0x1b1b1d), legs:0x1b1b1d, hood:P.m(0x1b1b1d), hair:P.m(0x6b4226), glasses:true, beard:0x7a4a22, pill:true, mon:true})},
  {key:'macaco', name:'Macaco', cat:'Personagens', w:1, d:1, h:2, build:(add,P)=>{
    add(0.3,0.36,0.3, 0,0,0, P.m(0xa0692f));
    add(0.26,0.26,0.26, 0,0.36,0, P.m(0xb97a3c));
    add(0.22,0.06,0.02, 0,0.45,0.14, P.m(0x111111));
    add(0.1,0.3,0.1, -0.2,0.05,0, P.m(0x8a5a2b));
    add(0.1,0.3,0.1, 0.2,0.05,0, P.m(0x8a5a2b));
    add(0.08,0.4,0.08, 0.22,0,-0.15, P.m(0x8a5a2b));
  }},
  {key:'mini_astro', name:'Astronauta', cat:'Personagens', w:1, d:1, h:6, build:(add,P)=>
    minifig(add,P,{torso:P.m(0xf1f1f1), legs:0xf1f1f1, head:'helmet'})},
  {key:'mini_ninja', name:'Ninja', cat:'Personagens', w:1, d:1, h:6, build:(add,P)=>
    minifig(add,P,{torso:P.m(0x1d1d1d), legs:0x1d1d1d, head:'ninja'})},
  {key:'mini_pirata', name:'Pirata', cat:'Personagens', w:1, d:1, h:6, build:(add,P)=>
    minifig(add,P,{torso:P.m(0xf4f4f4), legs:0x2f3b4f, head:'pirate'})},
  {key:'mini_bombeiro', name:'Bombeiro', cat:'Personagens', w:1, d:1, h:6, build:(add,P)=>
    minifig(add,P,{torso:P.m(0xf57c20), legs:0x2a3a5a, head:'fire'})}
];

let cat='Tijolos', partIdx=0, colorIdx=6, rot=0, delMode=false;
let bricks=[], topH=new Int16Array(N*N), hist=[], hover=null, msgTimer=null;

function parts(){
  const c=CATS[cat];
  if(c.models) return MODELS.filter(m=>(m.cat||'Modelos')===cat).map(m=>({w:m.w,d:m.d,h:m.h,stud:false,model:m.key,label:m.name}));
  return c.list.map(([w,d])=>({w,d,h:c.h,stud:c.stud,label:w+'×'+d}));
}
function cur(){ const p=parts(); return p[partIdx]||p[0]; }
function dims(p){ return rot ? {w:p.d,d:p.w} : {w:p.w,d:p.d}; }
function inBounds(x0,y0,w,d){ return x0>=0 && y0>=0 && x0+w<=N && y0+d<=N; }
function footprintZ(x0,y0,w,d){ let z=0; for(let i=0;i<w;i++)for(let j=0;j<d;j++) z=Math.max(z,topH[(y0+j)*N+(x0+i)]); return z; }
function rebuildTop(){
  topH=new Int16Array(N*N);
  for(const b of bricks) for(let i=0;i<b.w;i++)for(let j=0;j<b.d;j++) topH[(b.y+j)*N+(b.x+i)]=b.z+b.h;
}
function toast(t){
  const m=document.getElementById('msg'); m.textContent=t; m.classList.add('show');
  clearTimeout(msgTimer); msgTimer=setTimeout(()=>m.classList.remove('show'),1400);
}
function snapshot(){ hist.push(bricks.slice()); if(hist.length>200) hist.shift(); }

/* ---------- Cena ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf6f5f1);
const camera=new THREE.PerspectiveCamera(40,1,0.1,400);

scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(14,26,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-38; sun.shadow.camera.right=38;
sun.shadow.camera.top=38; sun.shadow.camera.bottom=-38;
sun.shadow.camera.far=100;
scene.add(sun);

const plate=new THREE.Mesh(new THREE.BoxGeometry(N,0.4,N), new THREE.MeshStandardMaterial({color:0xe9e7e1,roughness:0.9}));
plate.position.y=-0.2; plate.receiveShadow=true;
scene.add(plate);
const grid=new THREE.GridHelper(N,N,0xc9c6bd,0xd9d6ce);
grid.position.y=0.005;
scene.add(grid);

const bricksGroup=new THREE.Group(); scene.add(bricksGroup);
const ghostGroup=new THREE.Group(); scene.add(ghostGroup);

const mats={};
function matFor(c){ if(!mats[c]) mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:0.35}); return mats[c]; }
const studGeo=new THREE.CylinderGeometry(0.3,0.3,0.18,20);

function modelMesh(b,mat,ghost){
  const g=new THREE.Group();
  const def=MODELS.find(m=>m.key===b.model);
  const P={
    main:mat,
    wood: ghost?mat:fixedMat(WOOD),
    white: ghost?mat:fixedMat(WHITE),
    dark: ghost?mat:fixedMat(DARK),
    green: ghost?mat:fixedMat(GREEN),
    pot: ghost?mat:fixedMat(POT),
    glass: ghost?mat:glassMat,
    m: (hex)=> ghost?mat:fixedMat(hex),
    glow: ghost?mat:glowMat
  };
  const add=(sx,sy,sz,x,y,z,m)=>{
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
    mesh.position.set(x,y+sy/2,z);
    mesh.castShadow=true; mesh.receiveShadow=true;
    g.add(mesh);
  };
  def.build(add,P);
  g.rotation.y=b.rot?Math.PI/2:0;
  g.position.set(b.x+b.w/2-N/2, b.z*H, b.y+b.d/2-N/2);
  return g;
}

function brickMesh(b,mat,ghost){
  if(b.model) return modelMesh(b,mat,ghost);
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(b.w-0.06,b.h*H-0.02,b.d-0.06),mat);
  body.position.y=b.h*H/2; body.castShadow=true; body.receiveShadow=true;
  g.add(body);
  if(b.stud){
    for(let i=0;i<b.w;i++)for(let j=0;j<b.d;j++){
      const s=new THREE.Mesh(studGeo,mat);
      s.position.set(i+0.5-b.w/2, b.h*H+0.08, j+0.5-b.d/2);
      s.castShadow=true;
      g.add(s);
    }
  }
  g.position.set(b.x+b.w/2-N/2, b.z*H, b.y+b.d/2-N/2);
  return g;
}

function rebuildAll(){
  while(bricksGroup.children.length) bricksGroup.remove(bricksGroup.children[0]);
  for(const b of bricks) bricksGroup.add(brickMesh(b,matFor(b.c)));
  rebuildTop();
}

function updateGhost(){
  while(ghostGroup.children.length) ghostGroup.remove(ghostGroup.children[0]);
  if(!hover || delMode) return;
  const p=cur(), {w,d}=dims(p);
  const x0=hover[0]-Math.floor(w/2), y0=hover[1]-Math.floor(d/2);
  const ok=inBounds(x0,y0,w,d);
  const z=ok?footprintZ(x0,y0,w,d):0;
  const valid=ok && z+p.h<=MAXH;
  const m=new THREE.MeshStandardMaterial({color:valid?COLORS[colorIdx][1]:0xff3b30,transparent:true,opacity:0.5,depthWrite:false});
  ghostGroup.add(brickMesh({x:x0,y:y0,w,d,h:p.h,z,stud:p.stud,model:p.model,rot},m,true));
}

/* ---------- Ações ---------- */
function place(cx,cy){
  const p=cur(), {w,d}=dims(p);
  const x0=cx-Math.floor(w/2), y0=cy-Math.floor(d/2);
  if(!inBounds(x0,y0,w,d)){ toast('Fora da base'); return; }
  const z=footprintZ(x0,y0,w,d);
  if(z+p.h>MAXH){ toast('Altura máxima atingida'); return; }
  snapshot();
  const b={x:x0,y:y0,w,d,h:p.h,z,c:COLORS[colorIdx][1],stud:p.stud,model:p.model,rot};
  bricks.push(b);
  bricksGroup.add(brickMesh(b,matFor(b.c)));
  rebuildTop(); update();
}

function removeAt(cx,cy){
  let best=-1;
  bricks.forEach((b,i)=>{
    if(cx>=b.x&&cx<b.x+b.w&&cy>=b.y&&cy<b.y+b.d&&(best<0||b.z+b.h>bricks[best].z+bricks[best].h)) best=i;
  });
  if(best<0){ toast('Nada para remover aqui'); return; }
  snapshot(); bricks.splice(best,1); rebuildAll(); update();
}

/* ---------- Câmera e toque ---------- */
let theta=0.7, phi=0.9, radius=60;
const target=new THREE.Vector3(0,1,0);
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function updateCam(){
  phi=Math.min(1.5,Math.max(0.15,phi));
  radius=Math.min(130,Math.max(8,radius));
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
function pickCell(e){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([plate,bricksGroup],true);
  if(!hits.length) return null;
  const h=hits[0];
  const p=h.point.clone().add(h.face.normal.clone().multiplyScalar(0.05));
  return [Math.floor(p.x+N/2), Math.floor(p.z+N/2)];
}

const dom=renderer.domElement;
const ptrs=new Map();
let tapStart=null, moved=false, pinch=0;
function pinchDist(){ const v=[...ptrs.values()]; return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y); }

dom.addEventListener('pointerdown',e=>{
  dom.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ tapStart={x:e.clientX,y:e.clientY}; moved=false; }
  else { moved=true; pinch=pinchDist(); }
});
dom.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){
    if(e.pointerType==='mouse'){ hover=pickCell(e); updateGhost(); }
    return;
  }
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1){
    if(tapStart && Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>8) moved=true;
    if(moved){ theta-=dx*0.008; phi-=dy*0.006; updateCam(); }
  } else if(ptrs.size===2){
    const d=pinchDist();
    if(pinch>0 && d>0) radius*=pinch/d;
    pinch=d; updateCam();
  }
});
dom.addEventListener('pointerup',e=>{
  const wasSingle=ptrs.size===1;
  ptrs.delete(e.pointerId);
  if(wasSingle && !moved && tapStart){
    tapStart=null;
    const c=pickCell(e);
    if(!c){ toast('Toque em cima da base'); }
    else if(delMode) removeAt(c[0],c[1]);
    else place(c[0],c[1]);
  }
  if(ptrs.size===0) tapStart=null;
});
dom.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); tapStart=null; });
dom.addEventListener('pointerleave',()=>{ hover=null; updateGhost(); });
dom.addEventListener('wheel',e=>{ e.preventDefault(); radius*=e.deltaY>0?1.1:0.9; updateCam(); },{passive:false});

/* ---------- Interface ---------- */
function renderPanel(){
  const cats=document.getElementById('cats'); cats.innerHTML='';
  for(const name of Object.keys(CATS)){
    const b=document.createElement('button');
    b.textContent=name; if(name===cat) b.className='on';
    b.onclick=()=>{ cat=name; partIdx=0; update(); };
    cats.appendChild(b);
  }
  const pr=document.getElementById('parts'); pr.innerHTML='';
  parts().forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='part'+(i===partIdx?' on':'');
    b.textContent=p.label;
    b.onclick=()=>{ partIdx=i; update(); };
    pr.appendChild(b);
  });
  const cl=document.getElementById('colors'); cl.innerHTML='';
  COLORS.forEach(([n,hex],i)=>{
    const b=document.createElement('button');
    b.className='sw'+(i===colorIdx?' on':'');
    b.style.background=hex; b.title=n; b.setAttribute('aria-label',n);
    b.onclick=()=>{ colorIdx=i; update(); };
    cl.appendChild(b);
  });
}
function update(){
  document.getElementById('count').textContent=bricks.length+(bricks.length===1?' peça':' peças');
  document.getElementById('undo').disabled=hist.length===0;
  document.getElementById('rot').classList.toggle('on',rot===1);
  document.getElementById('del').classList.toggle('on',delMode);
  renderPanel();
  updateGhost();
}

document.getElementById('rot').onclick=()=>{ rot^=1; update(); };
document.getElementById('del').onclick=()=>{ delMode=!delMode; update(); toast(delMode?'Toque numa peça para remover':'Modo construir'); };
document.getElementById('undo').onclick=()=>{ if(!hist.length) return; bricks=hist.pop(); rebuildAll(); update(); };
document.getElementById('clear').onclick=()=>{ if(!bricks.length) return; snapshot(); bricks=[]; rebuildAll(); update(); toast('Tudo limpo. Use Desfazer para voltar'); };
document.getElementById('view').onclick=()=>{ theta=0.7; phi=0.9; radius=60; updateCam(); };

function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
window.onerror=(m)=>{ const el=document.getElementById('msg'); el.textContent='Erro: '+m; el.classList.add('show'); };

resize();
updateCam();
rebuildAll();
update();
(function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera); })();
</script>
